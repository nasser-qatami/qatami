 if(tf){const open=o=>{if(o){const bx=el.querySelector('.ayat');if(bx){const R=el.getBoundingClientRect(),B=bx.getBoundingClientRect(),a=bx.querySelector('.ay.on')||bx.querySelector('.ay'),h=a?a.getBoundingClientRect().height:B.height,top=R.top+78,bot=R.bottom-tf.offsetHeight-14,sc=Math.min(.9,(bot-top)/h),cy=(top+bot)/2,by=B.top+B.height/2;el.style.setProperty('--sc',sc.toFixed(3));el.style.setProperty('--ty',(cy-by).toFixed(1)+'px')}}el._room=undefined;el.classList.toggle('tfo',o);if(o)S('rl/tf/'+r.k,r.surah)};el._tfx=()=>open(false);
  tfb.addEventListener('click',e=>{e.stopPropagation();open(true)});tf.querySelector('.x').addEventListener('click',()=>open(false));

  let k=0;r.ay.forEach((a,j)=>{if(c>=a.t-.15)k=j});if(tf&&el._tk!==k){const first=el._tk===undefined,same=!first&&r.ay[el._tk]&&r.ay[el._tk].tf===r.ay[k].tf;el._tk=k;const hd=()=>{tfh.innerHTML='سورة '+r.surah+'<span class="md">﴿'+AR(r.ay[k].n)+'﴾</span>'};

  if(tf&&el.classList.contains('tfo')&&!tfp.classList.contains('sw')){const now=performance.now();
