<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مقاطع · نبأ عظيم</title><meta name="theme-color" content="#0E0B07">
<style>
@font-face{font-family:Hafs;src:url(fonts/hafs.otf)}@font-face{font-family:Ruqaa;font-weight:700;src:url(fonts/ruqaa700.woff2)}
@font-face{font-family:Cairo;font-weight:400;src:url(fonts/cairo400.woff2)}@font-face{font-family:Cairo;font-weight:600;src:url(fonts/cairo600.woff2)}
:root{--gold:#E3C36A;--gold2:#A07A2C;--ink:#F3E9D2;--mute:#A9987A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0E0B07;overflow:hidden}
body{font-family:Cairo,sans-serif;color:var(--ink)}
#feed{height:100svh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
#feed::-webkit-scrollbar{display:none}
.reel{position:relative;height:100svh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;isolation:isolate;background:#14100A}
/* ---------- audio reel ---------- */
.reel.au{background:radial-gradient(120% 70% at 50% 0%,#2B2113 0%,#14100A 60%,#0B0905 100%)}
.reel.au .lat{position:absolute;inset:0;z-index:-2;opacity:.55}
.reel.au .star{position:absolute;z-index:-1;left:50%;top:46%;width:150vw;height:150vw;margin:-75vw 0 0 -75vw;color:var(--gold);opacity:.07;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.reel.au .glow{position:absolute;inset:auto 0 0;height:50%;z-index:-1;background:radial-gradient(70% 60% at 50% 100%,rgba(227,195,106,.16),transparent)}
.hd{position:absolute;inset:calc(env(safe-area-inset-top,0px) + 18px) 18px auto;display:flex;justify-content:space-between;align-items:flex-start}
.hd .sn{font-family:Ruqaa;font-weight:700;font-size:34px;line-height:1.2;background:linear-gradient(180deg,#FFF3CC,#E3C36A 55%,#A07A2C);-webkit-background-clip:text;background-clip:text;color:transparent}
.hd .sn small{display:block;font-family:Cairo;font-weight:400;font-size:12px;color:var(--mute);-webkit-text-fill-color:var(--mute);margin-top:2px}
.hd .nm{font-size:12px;color:var(--mute);padding-top:10px;direction:ltr;unicode-bidi:isolate}
.ayat{position:absolute;inset:100px 30px 262px;display:grid;place-items:center;text-align:center}
.ay{grid-area:1/1;max-height:100%;font-family:Hafs,serif;font-size:30px;line-height:2.05;color:#FFF3CF;opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s;text-shadow:0 0 30px rgba(227,195,106,.28);pointer-events:none}
.ay i{font-style:normal;font-family:Hafs;color:var(--gold);opacity:.8;margin-inline:6px;font-size:.8em}
.ay.on{opacity:1;transform:none}
.dots{position:absolute;inset:auto 0 244px;display:flex;justify-content:center;gap:7px}.dots b{width:6px;height:6px;border-radius:50%;background:rgba(227,195,106,.25);transition:.4s}.dots b.on{width:22px;border-radius:3px;background:var(--gold)}
.bot{position:absolute;inset:auto 0 0;padding:0 18px calc(env(safe-area-inset-bottom,0px) + 22px)}
.bars{display:flex;gap:3px;align-items:center;justify-content:center;height:26px;margin-bottom:12px;direction:ltr}
.bars b{width:3px;border-radius:2px;background:linear-gradient(180deg,#F5DC96,#A07A2C);height:6px;opacity:.9;animation:bar 1.1s ease-in-out infinite;animation-play-state:paused}
.reel.play .bars b{animation-play-state:running}
@keyframes bar{0%,100%{height:5px}50%{height:var(--h,22px)}}
.prog{position:relative;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.prog i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#A07A2C,#F5DC96);direction:ltr}
.prog.rtl i{inset:0 0 0 auto}
.meta{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--mute)}
.meta b{font-weight:600;color:var(--ink)}.meta [data-time]{direction:ltr;unicode-bidi:isolate}
.full{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:12px;border-radius:14px;border:1px solid rgba(227,195,106,.4);background:rgba(227,195,106,.08);color:var(--gold);font:600 13.5px Cairo;white-space:nowrap;backdrop-filter:blur(8px)}
/* side actions */
.row{display:flex;gap:10px;margin-top:14px;align-items:stretch}.row .full{margin-top:0;flex:1}
.ib{width:48px;border-radius:14px;border:1px solid rgba(227,195,106,.28);background:rgba(255,255,255,.04);color:var(--ink);display:grid;place-items:center;backdrop-filter:blur(8px)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}.ib.on{color:var(--gold);border-color:rgba(227,195,106,.6)}.ib.on svg{fill:var(--gold)}
/* ---------- video reel ---------- */
.reel.vd video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.reel.vd::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,6,3,.6),transparent 20%,transparent 48%,rgba(8,6,3,.88) 90%)}
.hint{position:absolute;inset:auto 0 calc(env(safe-area-inset-bottom,0px) + 4px);text-align:center;font-size:11px;color:rgba(255,255,255,.35)}

/* luxe video frame */
.reel .frm{position:absolute;inset:10px;border-radius:30px;pointer-events:none;border:1px solid transparent;
 background:linear-gradient(160deg,#F5DC96,rgba(227,195,106,.15) 30%,rgba(227,195,106,.15) 70%,#A07A2C) border-box;
 -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:2}
.reel .frm svg{position:absolute;width:34px;height:34px;color:#F5DC96;filter:drop-shadow(0 0 6px rgba(245,220,150,.5))}
.reel .frm svg:nth-child(1){top:-9px;right:-9px}.reel .frm svg:nth-child(2){top:-9px;left:-9px;transform:scaleX(-1)}
.reel .frm svg:nth-child(3){bottom:-9px;right:-9px;transform:scaleY(-1)}.reel .frm svg:nth-child(4){bottom:-9px;left:-9px;transform:scale(-1)}
.reel .top{position:absolute;inset:calc(env(safe-area-inset-top,0px) + 26px) 28px auto;display:flex;justify-content:space-between;align-items:center;z-index:3}
.reel .pill{font-family:Ruqaa;font-weight:700;font-size:19px;padding:3px 16px 6px;border-radius:999px;color:#F5DC96;background:rgba(14,11,7,.45);backdrop-filter:blur(10px);border:1px solid rgba(245,220,150,.35)}
.reel .nm{font-size:12px;color:rgba(255,255,255,.6);direction:ltr;unicode-bidi:isolate;background:rgba(14,11,7,.4);backdrop-filter:blur(10px);padding:3px 10px;border-radius:999px}
.reel .glass{position:absolute;inset:auto 26px calc(env(safe-area-inset-bottom,0px) + 28px);z-index:3;padding:16px 16px 16px;border-radius:24px;
 background:linear-gradient(160deg,rgba(40,30,16,.55),rgba(12,9,5,.72));backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
 border:1px solid rgba(245,220,150,.28);box-shadow:0 24px 40px -18px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.12)}
.reel .gt{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.reel .sn{font-family:Ruqaa;font-weight:700;font-size:32px;line-height:1.2;background:linear-gradient(180deg,#FFF3CC,#E3C36A 55%,#A07A2C);-webkit-background-clip:text;background-clip:text;color:transparent}
.reel .sn small{display:block;font-family:Cairo;font-weight:400;font-size:12px;color:var(--mute);-webkit-text-fill-color:var(--mute)}
.reel .who{text-align:left;display:grid;gap:2px;font-size:11.5px;color:var(--mute)}.reel .who b{font-size:13px;color:var(--ink);font-weight:600}
.reel .prog{height:2px}.reel .prog i{box-shadow:0 0 10px rgba(245,220,150,.7)}
.reel .tm{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--mute);direction:ltr}
.reel .row{margin-top:12px}

/* ---- polish: luxury + motion ---- */
.reel::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.reel .frm{border-width:1.5px;box-shadow:0 0 0 5px rgba(227,195,106,.05) inset}
.reel .glass{border-color:rgba(245,220,150,.32);box-shadow:0 30px 50px -20px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 4px rgba(245,220,150,.04);
 transform:translateY(26px);opacity:0;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s}
.reel.act .glass{transform:none;opacity:1}
.reel .top{opacity:0;transform:translateY(-10px);transition:opacity .8s .15s,transform .8s .15s cubic-bezier(.2,.8,.2,1)}
.reel.act .top{opacity:1;transform:none}
.reel .sn{position:relative;background-size:200% 100%}
.reel.act .sn{background-image:linear-gradient(100deg,#FFF3CC 0%,#E3C36A 30%,#FFFBE6 48%,#E3C36A 66%,#A07A2C 100%);background-size:260% 100%;background-position:100% 0;animation:shim 2.4s .5s ease-out forwards}
@keyframes shim{to{background-position:0 0}}
.ay{filter:blur(8px);transform:translateY(16px) scale(.985);transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1),filter .9s}
.ay.on{filter:none;transform:none}
.dots b{transition:width .5s cubic-bezier(.2,.8,.2,1),background .5s}
.prog{height:3px;transition:height .25s}.prog i{transition:width .25s linear}
.reel .prog{height:3px}
.ib,.full{transition:transform .2s,background .3s,border-color .3s}.ib:active,.full:active{transform:scale(.93)}
.ib.on svg{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.6)}100%{transform:none}}
.pz{position:absolute;left:50%;top:40%;width:84px;height:84px;margin:-42px;border-radius:50%;z-index:4;display:grid;place-items:center;background:rgba(14,11,7,.5);backdrop-filter:blur(14px);border:1px solid rgba(245,220,150,.4);opacity:0;transform:scale(.8);transition:.35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.pz svg{width:30px;height:30px;fill:#F5DC96}.reel.paused .pz{opacity:1;transform:none}
.burst{position:absolute;z-index:5;width:96px;height:96px;margin:-48px;pointer-events:none;animation:bst .9s cubic-bezier(.2,.8,.2,1) forwards}
.burst svg{width:100%;height:100%;fill:#F5DC96;filter:drop-shadow(0 0 16px rgba(245,220,150,.7))}
@keyframes bst{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.15);opacity:1}100%{transform:translateY(-70px) scale(1);opacity:0}}
#feed{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
.reel .tm span,.meta [data-time]{direction:ltr;unicode-bidi:bidi-override;font-variant-numeric:tabular-nums}

.ay{color:rgba(255,243,207,.34);text-shadow:none}
.ay span{transition:color .5s,text-shadow .5s}
.ay span.dn{color:#FFF3CF;text-shadow:0 0 22px rgba(227,195,106,.22)}
.ay span.cu{color:#F7DE9A;text-shadow:0 0 18px rgba(245,220,150,.75)}
.reel.au .glass .gt{margin-bottom:16px}
.reel .prog i{transition:none}
</style>
<body><svg width="0" height="0" style="position:absolute"><defs>

<symbol id="st" viewBox="0 0 100 100"><g fill="none" stroke="currentColor" stroke-width=".5"><rect x="22" y="22" width="56" height="56"/><rect x="22" y="22" width="56" height="56" transform="rotate(45 50 50)"/><circle cx="50" cy="50" r="30"/><circle cx="50" cy="50" r="18"/></g></symbol>
<symbol id="hr" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.8 1.2 5.6 3.1C13.8 6.2 15.600 5 17.600 5 21 5 23.100 8.400 21.600 11.800 19.500 16.400 12 21 12 21z"/></symbol>
<symbol id="cn" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 4h18M4 4v18"/><path d="M4 11l7-7"/></g><path d="M13 13l3.5 3.5L13 20l-3.500-3.500z" fill="currentColor"/></symbol><symbol id="mk" viewBox="0 0 24 24"><path d="M7 3h10v18l-5-4-5 4z"/></symbol>
<symbol id="sh" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></symbol>
</defs></svg>
<svg width="0" height="0" style="position:absolute"><symbol id="pl" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></symbol></svg><main id="feed"></main>
<script>
fetch('reels.json',{cache:'no-cache'}).then(r=>r.json()).then(D=>{
const bars=Array.from({length:34},(_,i)=>`<b style="--h:${8+Math.round(Math.abs(Math.sin(i*1.7)*Math.cos(i*.6))*26)}px;animation-delay:${(i%9)*-.13}s"></b>`).join("");
const ib=(i,c,l)=>`<button class="ib ${c}" aria-label="${l}"><svg><use href="#${i}"/></svg></button>`;
const AR=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const fmt=s=>AR(Math.floor(s/60))+":"+AR(String(Math.floor(s%60)).padStart(2,"0"));
document.getElementById("feed").innerHTML=D.map((r,i)=>{
 const ay=r.ay.map((a,j)=>`<div class="ay" data-t="${a.t}">${a.text.split(" ").map((w,x)=>`<span data-w="${a.w[x]}">${w}</span>`).join(" ")}<i>﴿${AR(a.n)}﴾</i></div>`).join("");
 const head=`<div class="hd"><div class="sn">سورة ${r.surah}<small>الآيات ${r.range}</small></div><div class="nm">${i+1} / ${D.length}</div></div>`;
 const meta=`<div class="meta"><span><b>الشيخ ناصر القطامي</b> · ${r.src}</span><span data-time>${fmt(0)}</span></div>`;
 const full=`<div class="row">${ib('hr','lk','أعجبني')}${ib('mk','mk','علامة')}${ib('sh','sh','مشاركة')}<button class="full">اسمع الليلة كاملة</button></div>`;
 const dots=r.ay.length>1?`<div class="dots">${r.ay.map(()=>'<b></b>').join('')}</div>`:'';
 if(r.video) return `<section class="reel vd" data-i="${i}"><video src="${r.file}" playsinline muted preload="metadata"></video><div class="frm" aria-hidden="true"><svg viewBox="0 0 40 40"><use href="#cn"/></svg><svg viewBox="0 0 40 40"><use href="#cn"/></svg><svg viewBox="0 0 40 40"><use href="#cn"/></svg><svg viewBox="0 0 40 40"><use href="#cn"/></svg></div><div class="top"><span class="pill">نَبَأٌ عَظِيم</span><span class="nm">${i+1} / ${D.length}</span></div><div class="glass"><div class="gt"><div class="sn">سورة ${r.surah}<small>الآيات ${r.range}</small></div><div class="who"><b>الشيخ ناصر القطامي</b><span>${r.src}</span></div></div><div class="prog rtl"><i></i></div><div class="tm"><span data-time>${fmt(0)}</span><span>${fmt(r.dur)}</span></div>${full}</div></section>`;
 return `<section class="reel au" data-i="${i}"><svg class="lat" width="100%" height="100%"><rect width="100%" height="100%" fill="url(#lat)"/></svg><svg class="star"><use href="#st"/></svg><div class="glow"></div><div class="frm" aria-hidden="true"><svg viewBox="0 0 40 40"><use href="#cn"/></svg><svg viewBox="0 0 40 40"><use href="#cn"/></svg><svg viewBox="0 0 40 40"><use href="#cn"/></svg><svg viewBox="0 0 40 40"><use href="#cn"/></svg></div><div class="top"><span class="pill">نَبَأٌ عَظِيم</span><span class="nm">${i+1} / ${D.length}</span></div><div class="ayat">${ay}</div>${dots}<div class="glass"><div class="gt"><div class="sn">سورة ${r.surah}<small>الآيات ${r.range}</small></div><div class="who"><b>الشيخ ناصر القطامي</b><span>${r.src}</span></div></div><div class="prog rtl"><i></i></div><div class="tm"><span data-time>${fmt(0)}</span><span>${fmt(r.dur)}</span></div>${full}</div></section>`;
}).join("");

function fit(){document.querySelectorAll('.reel').forEach(r=>{const box=r.querySelector('.ayat');if(!box)return;const H=box.clientHeight;r.querySelectorAll('.ay').forEach(a=>{let f=34;a.style.fontSize=f+'px';while(a.scrollHeight>H&&f>15){f--;a.style.fontSize=f+'px'}})})}
document.fonts.ready.then(fit);addEventListener('resize',fit);

// ---- playback: one shared audio element (iOS unlocks it once with a tap) ----
const H=(()=>{try{return parent!==window&&parent.reelHook}catch{return null}})()||null;
const S=(p,t)=>{try{H&&H.stat(p,t)}catch{}};
const LK=(()=>{try{return JSON.parse(localStorage.getItem('qtm:rlike')||'{}')}catch{return{}}})();
const A=(H&&H.audio&&H.audio())||new Audio();A.preload='auto';let cur=-1,needTap=false;
const secs=[...document.querySelectorAll('.reel')];
secs.forEach((el,i)=>{const r=D[i];
 el.insertAdjacentHTML('beforeend','<div class="pz"><svg><use href="#pl"/></svg></div>');
 const v=el.querySelector('video'),prog=el.querySelector('.prog i'),tm=el.querySelector('[data-time]'),ays=[...el.querySelectorAll('.ay')],dots=[...el.querySelectorAll('.dots b')],wsp=ays.map(a=>[...a.querySelectorAll('span')]);
 el._v=v;
 el._tick=()=>{const c=A.currentTime||0;
  wsp.forEach(L=>L.forEach((w,x)=>{const t=+w.dataset.w,n=L[x+1];w.classList.toggle('dn',t<=c-.05);w.classList.toggle('cu',t<=c&&(!n||+n.dataset.w>c))}));
  prog.style.width=Math.min(100,c/r.dur*100)+'%';tm.textContent=fmt(c);
  let k=0;r.ay.forEach((a,j)=>{if(c>=a.t-.15)k=j});ays.forEach((a,j)=>a.classList.toggle('on',j===k));dots.forEach((d,j)=>d.classList.toggle('on',j===k));
  if(v&&!A.paused&&Math.abs(v.currentTime-c)>.3)v.currentTime=c};
 el.querySelector('.prog').addEventListener('click',e=>{const b=e.currentTarget.getBoundingClientRect();A.currentTime=Math.max(0,(b.right-e.clientX)/b.width*r.dur);if(v)v.currentTime=A.currentTime});
 let last=0;el.addEventListener('click',e=>{if(e.target.closest('button,.prog'))return;const now=Date.now();
  if(now-last<320){const h=document.createElement('div');h.className='burst';h.style.left=e.clientX+'px';h.style.top=e.clientY+'px';h.innerHTML='<svg><use href="#hr"/></svg>';el.appendChild(h);setTimeout(()=>h.remove(),900);like(el,i,true)}
  else setTimeout(()=>{if(Date.now()-last>=300)toggle()},320);last=now});
 const lk=el.querySelector('.lk');lk.classList.toggle('on',!!LK[r.k]);lk.addEventListener('click',()=>like(el,i));
 el.querySelector('.mk').addEventListener('click',e=>{const b=e.currentTarget;if(H&&H.mark){H.mark(r.key,Math.floor(r.off+(A.currentTime||0)));b.classList.add('on');setTimeout(()=>b.classList.remove('on'),1400)}});
 el.querySelector('.sh').addEventListener('click',()=>{const url=(H&&H.url?H.url():location.href.replace(/reels\.html.*$/,''))+'#reels-'+r.k,t='سورة '+r.surah+' · الشيخ ناصر القطامي';S('rl/share/'+r.k,t);
  if(navigator.share)navigator.share({title:t,url}).catch(()=>{});else navigator.clipboard&&navigator.clipboard.writeText(url)});
 el.querySelector('.full').addEventListener('click',()=>{S('rl/full/'+r.k,r.surah);A.pause();if(H&&H.full)H.full(r.key,Math.floor(r.off))});
});
function like(el,i,only){const r=D[i],b=el.querySelector('.lk'),on=only?true:!b.classList.contains('on');if(on===b.classList.contains('on'))return;b.classList.toggle('on',on);
 if(on){LK[r.k]=1;S('rl/like/'+r.k,r.surah)}else delete LK[r.k];try{localStorage.setItem('qtm:rlike',JSON.stringify(LK))}catch{}}
function toggle(){const el=secs[cur];if(!el)return;if(A.paused){play();}else{A.pause();el._v&&el._v.pause();el.classList.add('paused')}}
function play(){const el=secs[cur];A.play().then(()=>{needTap=false;el.classList.remove('paused');el._v&&el._v.play().catch(()=>{})}).catch(()=>{needTap=true;el.classList.add('paused')})}
A.addEventListener('play',()=>secs[cur]&&secs[cur].classList.add('play'));A.addEventListener('pause',()=>secs[cur]&&secs[cur].classList.remove('play'));
A.addEventListener('ended',()=>{const n=secs[cur+1];if(n)n.scrollIntoView({behavior:'smooth'});else{A.currentTime=0;play()}});
function go(i){if(i===cur)return;secs.forEach((x,j)=>{if(j!==i){x.classList.remove('act','play','paused');x._v&&x._v.pause()}});cur=i;const el=secs[i],r=D[i];el.classList.add('act');
 A.src=r.aud;A.currentTime=0;if(el._v){el._v.currentTime=0}el._tick();play();S('rl/v/'+r.k,'سورة '+r.surah);history.replaceState(null,'','#'+r.k);try{H&&H.at&&H.at(r.k)}catch{}}
